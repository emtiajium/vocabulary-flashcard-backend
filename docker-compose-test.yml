version: '3.7'
# OPTIONAL. The automated tests run against an in-memory PGlite instance by default
# (see `test/pglite`), so no backing service is needed anymore.
# This stack is only required when the suites must run against a real Postgres:
#   docker-compose -f docker-compose-test.yml up -d
#   PGLITE_ENABLED=false npm test
services:
    ielts-gibberish-test-database:
        image: postgres:14.10
        container_name: ielts-gibberish-test-postgres
        restart: always
        ports:
            - '5429:5432'
        deploy:
            resources:
                limits:
                    memory: 512M
                reservations:
                    memory: 512M
        environment:
            POSTGRES_PASSWORD: 123
            POSTGRES_USER: postgres
            POSTGRES_DB: ielts-gibberish
        # https://docs.docker.com/storage/tmpfs/
        tmpfs:
            - /var/lib/postgresql/data
        # https://www.postgresql.org/docs/14/non-durability.html
        # https://www.postgresql.org/docs/14/runtime-config-wal.html
        command: -c fsync=off -c synchronous_commit=off -c full_page_writes=off
