name: CI

on: [push, pull_request]

jobs:
    # Fast, static checks. No database is needed.
    static-checks:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Prettier
              run: npm run format:check

            - name: ESLint
              run: npm run lint:check

            # The production dependency set must be enough to build the service.
            - name: Build
              run: npm ci --omit dev && npm run build

    # Primary test gate. Boots an in-memory PGlite instance (WASM PostgreSQL 18) and
    # applies the real migrations, so no Docker daemon nor database service is required.
    tests-pglite:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Create environment variables
              run: npm run create:env

            - name: Automated Test
              run: npm run test

    # PostgreSQL 14 gate: the version running in production. This is the only place where
    # migrations really run transactionally with `queryRunner.connection.query(...)` on a
    # separate connection, and where the actual engine compiles/plans the SQL.
    tests-postgresql-14:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:14.10
                env:
                    POSTGRES_PASSWORD: 123
                    POSTGRES_USER: postgres
                    POSTGRES_DB: ielts-gibberish
                ports:
                    - 5429:5432
                # https://docs.docker.com/storage/tmpfs/
                # https://www.postgresql.org/docs/14/non-durability.html
                options: >-
                    --tmpfs /var/lib/postgresql/data
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Create environment variables
              run: npm run create:env

            - name: Apply the migrations against PostgreSQL 14
              run: npm run migration:run:local-test

            - name: Automated Test
              run: npm run test:external-db

    tag:
        runs-on: ubuntu-latest
        needs: [static-checks, tests-pglite, tests-postgresql-14]
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Read version from package.json
              id: version
              run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

            - name: Create and push tag
              env:
                  VERSION: ${{ steps.version.outputs.value }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "${VERSION}" -m "Release ${VERSION}"
                  git push origin "refs/tags/${VERSION}"
