name: CI

on: [push, pull_request]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.23.4]

        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: npm i

            - name: Prettier
              run: npm run format:check

            - name: ESLint
              run: npm run lint:check

            - name: Create environment variables
              run: npm run create:env

            # The test suites boot an in-memory PGlite instance and apply the
            # migrations by themselves, no Docker/Postgres service is required.
            - name: Automated Test
              run: npm run test

            - name: Build
              run: rm -rf node_modules/ && npm install --omit dev && npm run build

    tag:
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Read version from package.json
              id: version
              run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

            - name: Create and push tag
              env:
                  VERSION: ${{ steps.version.outputs.value }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "${VERSION}" -m "Release ${VERSION}"
                  git push origin "refs/tags/${VERSION}"
