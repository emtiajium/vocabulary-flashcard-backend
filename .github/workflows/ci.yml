name: CI

on: [push, pull_request]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.11.0]

        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: npm i

            - name: Prettier
              run: npm run format:check

            - name: ESLint
              run: npm run lint:check

            - name: Login to Docker Hub
              uses: docker/login-action@v1
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

            - name: Run Docker containers
              run: |
                  docker compose -f docker-compose-ci.yml up -d
                  docker compose -f docker-compose-ci.yml ps
                  docker volume ls
                  docker inspect --format '{{json .Mounts}}' ielts-gibberish-test-postgres

            - name: Create environment variables
              run: npm run create:env

            - name: Database Tables' modification
              run: npm run migration:run:local-test

            - name: Automated Test
              run: npm run test

            - name: Build
              run: rm -rf node_modules/ && npm install --omit dev && npm run build

            - name: Clean Docker containers
              run: |
                  docker compose -f docker-compose-ci.yml stop
                  docker compose -f docker-compose-ci.yml rm -f
                  docker compose -f docker-compose-ci.yml down --volumes

    tag:
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Read version from package.json
              id: version
              run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

            - name: Create and push tag
              env:
                  VERSION: ${{ steps.version.outputs.value }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "${VERSION}" -m "Release ${VERSION}"
                  git push origin "refs/tags/${VERSION}"
