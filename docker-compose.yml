version: '3.7'
# Development database only (npm run start:dev / npm run migration:run).
# The automated tests run on in-memory PGlite, see docs/PGLITE.md.
services:
    ielts-gibberish-database:
        image: postgres:14.10
        container_name: ielts-gibberish-postgres
        restart: always
        ports:
            - '5431:5432'
        deploy:
            resources:
                limits:
                    memory: 512M
                reservations:
                    memory: 512M
        environment:
            POSTGRES_PASSWORD: 123
            POSTGRES_USER: postgres
            POSTGRES_DB: ielts-gibberish
        volumes:
            - 'ielts-gibberish-postgres-data:/var/lib/postgresql/data'

volumes:
    ielts-gibberish-postgres-data:
        name: ielts-gibberish-postgres-data
        driver: local
